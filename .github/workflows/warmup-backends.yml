name: Warm Up All Backends

on:
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest

    steps:
      - name: Wake All Services
        run: |
          echo "🔴 SYSTEM STATUS: COLD / STARTING UP"
          echo "⏳ Initializing backend wake-up sequence..."
          echo ""

          curl --fail -s https://backend-auth-service-ks6f.onrender.com >/dev/null & PID1=$!
          curl --fail -s https://backend-product-service-ncl2.onrender.com >/dev/null & PID2=$!
          curl --fail -s https://backend-cart-order-service-q6qh.onrender.com >/dev/null & PID3=$!
          curl --fail -s https://backend-ml-events-service-ba9v.onrender.com >/dev/null & PID4=$!
          curl --fail -s https://backend-ml-recommendation-service-huu6.onrender.com >/dev/null & PID5=$!

          echo "🟡 SERVICES ARE WAKING UP..."
          echo "🟡 Waiting for all backend services to respond..."
          echo ""

          wait $PID1
          wait $PID2
          wait $PID3
          wait $PID4
          wait $PID5

          echo ""
          echo "🟢 SYSTEM STATUS: ONLINE"
          echo "🟢 ALL BACKEND SERVICES ARE UP AND RUNNING"
          echo "🚀 READY TO ACCEPT TRAFFIC"
